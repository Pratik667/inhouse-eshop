<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Price Watch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark"><span>↗</span></div> flight watch</div>
      <div class="status"><span class="status-dot"></span> Live subscription</div>
    </header>
    <div id="app" aria-live="polite"><div class="loading">Loading your flight watch...</div></div>
    <footer>Prices and availability can change. Last checked time is shown from the subscription feed.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
